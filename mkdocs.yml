site_name: T-Invest Python SDK
site_url: https://opensource.tbank.ru/invest/invest-python/
site_description: 'Python SDK, gRPC client, bot examples'

repo_name: 'invest/invest-python'
repo_url: 'https://opensource.tbank.ru/invest/invest-python'
edit_uri: "-/edit/master/docs/"

copyright: 'Copyright &copy; 2023 T-technologies'

use_directory_urls: true
nav:
  - 'Главная': 'README.md'
  - 'API Reference':
    - Clients: api/clients.md
  - 'Разработка с LLM':
    - 'Обзор': 'ai/README.md'
    - 'Карта SDK': 'ai/sdk-map.md'
    - 'Реальный контур и песочница': 'ai/real-vs-sandbox.md'
    - 'Безопасность': 'ai/trading-safety.md'
    - 'Типичные ошибки': 'ai/common-pitfalls.md'
    - 'Сценарии для агентов':
      - 'Разработка программы': 'ai/prompts/build-trading-program.md'
      - 'Ревью программы': 'ai/prompts/review-trading-program.md'
  - 'Примеры': 'examples.md'
  - 'Готовые работы': 'robots.md'
  - 'Список изменений': 'CHANGELOG.md'
  - 'Участие в проекте': 'CONTRIBUTING.md'

theme:
  name: material
  language: ru
  palette:
    primary: black
    accent: yellow

plugins:
- include-markdown
- termynal: {}
- search:
    lang: ru
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        rendering:
          show_source: false

extra_css:
  - custom.css

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
